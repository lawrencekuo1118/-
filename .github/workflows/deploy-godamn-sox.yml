name: Deploy Godamn SOX

on:
  push:
    branches: [master]
    paths:
      - "control-design-app/**"
      - ".github/workflows/deploy-godamn-sox.yml"

concurrency:
  group: deploy-godamn-sox
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          pkgs <- c("rsconnect", "shiny", "bslib", "DT", "jsonlite", "readxl", "writexl")
          install.packages(pkgs, repos = "https://cloud.r-project.org")
          stopifnot(vapply(pkgs, requireNamespace, quietly = TRUE, FUN.VALUE = logical(1)))
        shell: Rscript {0}

      - name: Deploy to shinyapps.io
        working-directory: control-design-app
        env:
          SHINYAPPS_ACCOUNT: hopesmasher1118
          SHINYAPPS_APPNAME: godamn-sox
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: Rscript deploy.R
