name: Deploy Goddamn SOX

on:
  push:
    branches: [master]
    paths:
      - "control-design-app/**"
      - ".github/workflows/deploy-goddamn-sox.yml"

concurrency:
  group: deploy-goddamn-sox
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: control-design-app
          extra-packages: |
            any::rsconnect
            any::shiny
            any::bslib
            any::DT
            any::jsonlite
            any::readxl
            any::writexl

      - name: Deploy to shinyapps.io
        working-directory: control-design-app
        env:
          SHINYAPPS_ACCOUNT: hopesmasher1118
          SHINYAPPS_APPNAME: goddamn-sox
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: Rscript deploy.R
